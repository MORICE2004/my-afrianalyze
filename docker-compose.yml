# Local stack. UNTESTED: Docker is not installed on the dev machine (docs/KNOWN_GAPS.md).
# Credentials below are local-development defaults only; set POSTGRES_PASSWORD in a .env file to override.
# After the first start, load data with the pipeline commands in CLAUDE.md ("Project map and commands"),
# run inside the api container, e.g.  docker compose exec api python -m pipelines.load_security_master

services:
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000   # what the browser calls
    ports:
      - "3000:3000"
    environment:
      - API_URL_INTERNAL=http://api:8000            # what server-side rendering calls inside Docker
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=DEVELOPMENT
      - DATABASE_URL=postgresql://afrianalyze:${POSTGRES_PASSWORD:-afrianalyze_dev}@db:5432/afrianalyze
      - CORS_ORIGINS=http://localhost:3000
      - SHOW_TRADE_LABELS=false
    volumes:
      - ./data:/app/data   # downloaded reports and processed extraction files
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Legacy Celery worker for the old agent research task (apps/api/tasks). The v1 pipelines run as
  # commands instead (see CLAUDE.md). Kept so the stack matches the documented architecture.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: celery -A apps.api.core.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql://afrianalyze:${POSTGRES_PASSWORD:-afrianalyze_dev}@db:5432/afrianalyze
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=afrianalyze
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-afrianalyze_dev}
      - POSTGRES_DB=afrianalyze
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afrianalyze"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
