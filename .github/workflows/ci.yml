name: CI

# Runs on the default branch (master) and on pull requests into it.
on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (v1 only; legacy litellm/celery tests skip themselves)
        run: |
          python -m pip install --upgrade pip
          grep -vE "^(celery|redis|tenacity|litellm)" requirements.txt > /tmp/req.txt
          pip install -r /tmp/req.txt
      - name: Database migrations apply cleanly
        run: alembic upgrade head
      - name: Unit tests (hand-checked values; no downloaded data needed)
        # The API and NMB integration tests skip themselves when the NMB data is not loaded.
        run: pytest -q tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
