name: Refresh data

# Weekday refresh of DSE prices and the macro inputs (BoT, NBS, Damodaran) into the PRODUCTION database.
# It does nothing until the owner stores the Neon connection string as the secret PRODUCTION_DATABASE_URL
# in the GitHub environment "production" (Settings > Environments). Never put the URL in this file.
#
# The DSE index is deliberately NOT refreshed here: pipelines/dse/import_public_index.py replaces the whole
# series from its download file, and a fresh runner holds only the newest days, so it would erase ten
# years of history. It needs an update-in-place mode first (docs/KNOWN_GAPS.md).
on:
  schedule:
    - cron: "0 15 * * 1-5"     # 18:00 in Dar es Salaam, after the DSE close
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-data          # never two refreshes writing at once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      UA: "Mozilla/5.0 (AfriEdge scheduled data refresh)"
    steps:
      - name: Stop unless the production database secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::PRODUCTION_DATABASE_URL is not set in the 'production' environment; nothing to refresh."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the API's requirements plus what the loaders read with
        if: env.SKIP != '1'
        run: pip install -r requirements-api.txt requests==2.34.2 xlrd==2.0.2 pypdfium2==5.13.0

      - name: DSE prices (full ten-year download each run, so the replace-all import keeps history)
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          for code in NMB CRDB; do
            curl -fsS --retry 3 -A "$UA" -o "${code}.json" \
              "https://dse.co.tz/api/get/market/prices/for/range/duration?security_code=${code}&days=3650&class=EQUITY"
            # Refuses a file for the wrong company or with an unexplained jump; the run then fails visibly.
            python -m pipelines.dse.import_public_prices --instrument "DSE:${code}" --file "${code}.json"
          done

      - name: Macro inputs (BoT bond yields and policy rate, NBS CPI, Damodaran)
        if: env.SKIP != '1'
        # Exits 1 if any job failed; the failure is also recorded in data_source_status and shown on /health.
        run: python -m pipelines.macro

      - name: Keep the downloaded source files as evidence (90 days)
        if: always() && env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: raw-sources-${{ github.run_id }}
          path: data/raw/
          retention-days: 90
          if-no-files-found: ignore
