name: Refresh data

# Weekday refresh of DSE prices, the DSEI index and the macro inputs (BoT, NBS, Damodaran) into the
# PRODUCTION database. It does nothing until the owner stores the Neon connection string as the secret
# PRODUCTION_DATABASE_URL in the GitHub environment "production" (Settings > Environments). Never put the
# URL in this file. GitHub runs scheduled workflows only from the default branch (master).
#
# Every importer MERGES (pipelines/dse/merge.py): new days are added, stored days are never deleted, and a
# past close the source revises is kept and reported (the run then fails so a person looks). Proven by
# tests/v1/test_refresh_preserves_history.py, which fails against the old delete-and-replace importers.
on:
  schedule:
    - cron: "0 15 * * 1-5"     # 18:00 in Dar es Salaam, after the DSE close
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-data          # never two refreshes writing at once
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      UA: "Mozilla/5.0 (AfriEdge scheduled data refresh)"
    steps:
      - name: Stop unless the production database secret is set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::PRODUCTION_DATABASE_URL is not set in the 'production' environment; nothing to refresh."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/checkout@v4
        if: env.SKIP != '1'
      - uses: actions/setup-python@v5
        if: env.SKIP != '1'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the API's requirements plus what the loaders read with
        if: env.SKIP != '1'
        run: pip install -r requirements-api.txt requests==2.34.2 xlrd==2.0.2 pypdfium2==5.13.0

      - name: DSE prices (last 30 days for every share already loaded, merged into the stored history)
        if: env.SKIP != '1'
        # Refuses a wrong-company file or an unexplained jump (checked against the last stored day); a share's
        # first ten-year load is a deliberate manual step, so refused shares are never slipped in here.
        run: python -m pipelines.dse.refresh_prices 30

      - name: DSE index (only the dates after the last stored level, one request per date)
        if: env.SKIP != '1'
        run: |
          set -euo pipefail
          python -m pipelines.dse.fetch_public_index --from auto --to today --delay 1
          # Each new level must follow the previous one (the first is checked against the stored level).
          python -m pipelines.dse.import_public_index --code DSEI --instrument DSE:DSEI

      - name: Macro inputs (BoT bond yields and policy rate, NBS CPI, Damodaran)
        if: env.SKIP != '1'
        # Exits 1 if any job failed; the failure is also recorded in data_source_status and shown on /health.
        run: python -m pipelines.macro

      - name: Keep the downloaded source files as evidence (90 days)
        if: always() && env.SKIP != '1'
        uses: actions/upload-artifact@v4
        with:
          name: raw-sources-${{ github.run_id }}
          path: data/raw/
          retention-days: 90
          if-no-files-found: ignore
